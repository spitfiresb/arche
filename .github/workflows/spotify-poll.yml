# The clock behind the music corner's podcast memory.
#
# Spotify's history endpoint never records podcast episodes, so an episode is
# observable only while it's actually playing. Site visits usually provide
# the observation for songs (a late check still recovers them from Spotify's
# history), but a podcast heard while nobody happens to be browsing the site
# would vanish. This poke guarantees a look every 15 minutes regardless of
# traffic — /api/spotify-poll runs the same cache refresh a visitor beat
# would have triggered.
#
# GitHub Actions rather than a Cloudflare Worker cron because Pages has no
# cron support and a second deployable project isn't worth carrying for one
# curl. Actions minutes are unlimited on public repos, so this costs nothing.
#
# SPOTIFY_POLL_TOKEN must exist both as a repo secret here and as an env var
# in the Pages dashboard; the endpoint refuses to work without it.
#
# GitHub's scheduler is best-effort, and "best-effort" turned out to mean
# something much weaker than lateness. Measured over 40 runs, a */15 schedule
# delivered 35% of its ticks: median gap 41 minutes, worst 111. It does not
# queue what it skips, so two thirds of the intended looks simply never
# happened and episodes inside those gaps were unobservable.
#
# Two changes, both aimed at that. The minute offsets dodge the stampede at
# :00/:15/:30/:45, which is where every hand-written cron in the world piles
# up and where the dropped ticks cluster. And the interval asks for three
# times the coverage actually wanted, because a scheduler that delivers a
# third of what you ask for has to be over-asked.
#
# This is still a bet on someone else's queue. If it doesn't hold, the fix is
# a Cloudflare Worker cron trigger poking the same endpoint — Pages has no
# cron of its own, so that means a second deployable, which is the cost this
# is trying to avoid paying.

name: spotify-poll

on:
  schedule:
    - cron: "4,9,14,19,24,29,34,39,44,49,54,59 * * * *"
  # Manual runs, for testing the wiring without waiting for the next tick.
  workflow_dispatch:

jobs:
  poke:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Poke /api/spotify-poll
        run: |
          curl -fsS --max-time 30 -X POST "https://zsaeed.com/api/spotify-poll" \
            -H "Authorization: Bearer $SPOTIFY_POLL_TOKEN"
        env:
          SPOTIFY_POLL_TOKEN: ${{ secrets.SPOTIFY_POLL_TOKEN }}
