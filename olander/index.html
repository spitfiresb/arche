<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Olander Agents — live demo</title>
<meta name="description" content="Streaming chat agent that turns plain-English questions into live ERP lookups.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="olander.css">
</head>
<body>
  <div class="oa-app">

    <aside class="oa-sidebar">
      <div class="oa-side-head">
        <span class="oa-wordmark">
          <svg class="oa-logo oa-logo-sm" viewBox="0 0 150 51.2" role="img" aria-label="Olander">
            <rect width="150" height="51" fill="var(--oa-red)"/>
            <g fill="#fff">
              <path d="m9 25.8c0-6.8 1.7-10.7 7.9-10.7s8.3 2.9 8.3 10.7-2.2 10.1-8.3 10.1c-5.9 0-7.9-2.8-7.9-10.1zm12.9 0c0-5.3-1.1-7.9-5-7.9-3.4 0-4.8 2.2-4.8 7.9s1.3 7.5 4.8 7.5 5-1.6 5-7.5z"/>
              <path d="m30.4 15.5h3.4v17.2h6.7v2.9h-10.1v-20.1z"/>
              <path d="m50.1 15.5h6.6l5 20.1h-3.3l-1.1-4.3h-7.8l-1.3 4.3h-3.4l5.3-20.1zm6.5 12.9-2.4-10.1h-1.5l-2.6 10.1h6.5z"/>
              <path d="m66.5 15.5h5.8l6 17.2h0.4v-17.2h3.1v20.1h-5.4l-6.3-17.2h-0.5v17.2h-3.1v-20.1z"/>
              <path d="m88.9 15.5h6.8c6.2 0 8.2 2.4 8.2 9.6 0 7.4-2 10.4-8.2 10.4h-6.8v-20zm6.7 17.2c3.9 0 4.9-2.2 4.9-7.3 0-4.9-1-7-4.9-7h-3.3v14.3h3.3z"/>
              <path d="m108.6 15.5h13v2.9h-9.4v5.6h7.5v2.8h-7.5v5.9h9.3v2.9h-12.9v-20.1z"/>
              <path d="m126.6 15.5h8c3.9 0 6.3 2.1 6.3 6.2 0 3.2-1.3 5-3.1 6l3.1 7.9h-3.4l-2.6-7.1h-4.7v7.1h-3.6v-20.1zm7.9 10.1c2 0 3.1-1.4 3.2-3.6 0-2.3-1.2-3.6-3.4-3.6h-4.1v7.2h4.3z"/>
            </g>
          </svg>
          <span class="oa-wordmark-label">Agents</span>
        </span>
      </div>

      <div class="oa-side-actions">
        <button type="button" class="oa-newchat" data-new-chat>
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
               stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
            <path d="M8 3.5v9M3.5 8h9"/>
          </svg>
          New chat
        </button>
        <label class="oa-search">
          <span class="oa-sr">Search chats</span>
          <span class="oa-search-icon" aria-hidden="true">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor"
                 stroke-width="1.6" stroke-linecap="round">
              <circle cx="7" cy="7" r="4.25"/><path d="M10.2 10.2 13.5 13.5"/>
            </svg>
          </span>
          <input type="search" placeholder="Search chats" data-search>
        </label>
      </div>

      <div class="oa-history" data-history></div>

      <div class="oa-side-foot">
        <span class="oa-side-link">Help</span>
        <span class="oa-side-link">Service status</span>
      </div>
    </aside>

    <div class="oa-main">
      <header class="oa-mobilebar">
        <button type="button" class="oa-icon-ghost" aria-label="Open chat history">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
            <path d="M2.5 4h11M2.5 8h11M2.5 12h11"/>
          </svg>
        </button>
        <span class="oa-wordmark">
          <svg class="oa-logo oa-logo-sm" viewBox="0 0 150 51.2" role="img" aria-label="Olander">
            <rect width="150" height="51" fill="var(--oa-red)"/>
            <g fill="#fff">
              <path d="m9 25.8c0-6.8 1.7-10.7 7.9-10.7s8.3 2.9 8.3 10.7-2.2 10.1-8.3 10.1c-5.9 0-7.9-2.8-7.9-10.1zm12.9 0c0-5.3-1.1-7.9-5-7.9-3.4 0-4.8 2.2-4.8 7.9s1.3 7.5 4.8 7.5 5-1.6 5-7.5z"/>
              <path d="m30.4 15.5h3.4v17.2h6.7v2.9h-10.1v-20.1z"/>
              <path d="m50.1 15.5h6.6l5 20.1h-3.3l-1.1-4.3h-7.8l-1.3 4.3h-3.4l5.3-20.1zm6.5 12.9-2.4-10.1h-1.5l-2.6 10.1h6.5z"/>
              <path d="m66.5 15.5h5.8l6 17.2h0.4v-17.2h3.1v20.1h-5.4l-6.3-17.2h-0.5v17.2h-3.1v-20.1z"/>
              <path d="m88.9 15.5h6.8c6.2 0 8.2 2.4 8.2 9.6 0 7.4-2 10.4-8.2 10.4h-6.8v-20zm6.7 17.2c3.9 0 4.9-2.2 4.9-7.3 0-4.9-1-7-4.9-7h-3.3v14.3h3.3z"/>
              <path d="m108.6 15.5h13v2.9h-9.4v5.6h7.5v2.8h-7.5v5.9h9.3v2.9h-12.9v-20.1z"/>
              <path d="m126.6 15.5h8c3.9 0 6.3 2.1 6.3 6.2 0 3.2-1.3 5-3.1 6l3.1 7.9h-3.4l-2.6-7.1h-4.7v7.1h-3.6v-20.1zm7.9 10.1c2 0 3.1-1.4 3.2-3.6 0-2.3-1.2-3.6-3.4-3.6h-4.1v7.2h4.3z"/>
            </g>
          </svg>
          <span class="oa-wordmark-label">Agents</span>
        </span>
        <span class="oa-mobilebar-spacer"></span>
        <button type="button" class="oa-icon-ghost" aria-label="Account menu">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
               stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </header>

      <header class="oa-topstrip">
        <button type="button" class="oa-title" data-title hidden>
          <span class="oa-title-text"></span>
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor"
               stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 6l5 5 5-5"/>
          </svg>
        </button>
        <span class="oa-topstrip-spacer"></span>
        <button type="button" class="oa-account" aria-label="Account menu">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </header>

      <main class="oa-body">
        <div class="oa-scroll" data-scroll>
          <div class="oa-stream" data-stream>
            <div class="oa-empty" data-empty>
              <svg class="oa-logo oa-logo-md" viewBox="0 0 150 51.2" role="img" aria-label="Olander">
                <rect width="150" height="51" fill="var(--oa-red)"/>
                <g fill="#fff">
                  <path d="m9 25.8c0-6.8 1.7-10.7 7.9-10.7s8.3 2.9 8.3 10.7-2.2 10.1-8.3 10.1c-5.9 0-7.9-2.8-7.9-10.1zm12.9 0c0-5.3-1.1-7.9-5-7.9-3.4 0-4.8 2.2-4.8 7.9s1.3 7.5 4.8 7.5 5-1.6 5-7.5z"/>
                  <path d="m30.4 15.5h3.4v17.2h6.7v2.9h-10.1v-20.1z"/>
                  <path d="m50.1 15.5h6.6l5 20.1h-3.3l-1.1-4.3h-7.8l-1.3 4.3h-3.4l5.3-20.1zm6.5 12.9-2.4-10.1h-1.5l-2.6 10.1h6.5z"/>
                  <path d="m66.5 15.5h5.8l6 17.2h0.4v-17.2h3.1v20.1h-5.4l-6.3-17.2h-0.5v17.2h-3.1v-20.1z"/>
                  <path d="m88.9 15.5h6.8c6.2 0 8.2 2.4 8.2 9.6 0 7.4-2 10.4-8.2 10.4h-6.8v-20zm6.7 17.2c3.9 0 4.9-2.2 4.9-7.3 0-4.9-1-7-4.9-7h-3.3v14.3h3.3z"/>
                  <path d="m108.6 15.5h13v2.9h-9.4v5.6h7.5v2.8h-7.5v5.9h9.3v2.9h-12.9v-20.1z"/>
                  <path d="m126.6 15.5h8c3.9 0 6.3 2.1 6.3 6.2 0 3.2-1.3 5-3.1 6l3.1 7.9h-3.4l-2.6-7.1h-4.7v7.1h-3.6v-20.1zm7.9 10.1c2 0 3.1-1.4 3.2-3.6 0-2.3-1.2-3.6-3.4-3.6h-4.1v7.2h4.3z"/>
                </g>
              </svg>
              <h2 class="oa-empty-title">How can I help today?</h2>
              <p class="oa-empty-sub">Ask about customers, inventory, or open orders.</p>
              <div class="oa-suggestions" data-suggestions></div>
            </div>
          </div>
        </div>

        <div class="oa-composer-wrap">
          <div class="oa-composer-inner">
            <form class="oa-composer" data-composer>
              <div class="oa-composer-row">
                <button type="button" class="oa-composer-icon" aria-label="Attach files">
                  <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor"
                       stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M13 7.5 8.2 12.3a3 3 0 0 1-4.2-4.2l5.3-5.3a2 2 0 0 1 2.8 2.8L6.7 11a1 1 0 0 1-1.4-1.4l4.6-4.6"/>
                  </svg>
                </button>
                <textarea rows="1" data-input placeholder="Ask about a customer, item, or order…"></textarea>
                <button type="submit" class="oa-send" aria-label="Send message" disabled>
                  <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor"
                       stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M8 13V3"/><path d="M3 8l5-5 5 5"/>
                  </svg>
                </button>
                <button type="button" class="oa-stop" aria-label="Stop generating" hidden>
                  <svg viewBox="0 0 16 16" width="14" height="14" fill="currentColor" aria-hidden="true">
                    <rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/>
                  </svg>
                </button>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="olander.js"></script>
</body>
</html>
