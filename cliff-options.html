<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cliff — polished</title>
<style>
  body { font-family: Georgia, serif; margin: 2em; background: #fff; color: #000; }
  h1 { font-size: 1.2em; }
  p.note { max-width: 44em; font-size: 0.9em; }
  .row { display: flex; gap: 3em; align-items: flex-start; }
  figure { margin: 0; }
  figcaption { font-size: 0.85em; margin-top: 0.6em; }
  svg { border-left: 1px solid #ddd; }
</style>
</head>
<body>
<h1>Polished pass</h1>
<p class="note">Same idea, tuned: cleaner line hierarchy, hatching that breathes
with the band (denser in the wide shadowed stretches, sparser on thin lit runs),
strokes floated off both edges, and the inner edge drawn as a flowing curve.</p>
<div class="row" id="row"></div>

<script>
(function () {
  const NS = 'http://www.w3.org/2000/svg';
  const W = 72, H = 460, FACE = 30;
  const f1 = v => v.toFixed(1);
  const noise = i => { const s = Math.sin(i * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
  const M = (x, y) => 'M' + f1(x) + ' ' + f1(y);
  const L = (x, y) => 'L' + f1(x) + ' ' + f1(y);

  /* ---- Silhouette (unchanged) ---- */
  const ph1 = noise(1) * 6.28, ph2 = noise(2) * 6.28;
  const macro = yy => -6.5 - 8 * Math.sin(yy / 150 + ph1) - 4.5 * Math.sin(yy / 57 + ph2);
  const pts = [[FACE + macro(0), 0]];
  const shelves = [];
  {
    let y = 0, i = 0;
    while (y < H) {
      ++i;
      const r = noise(i + 999);
      if (r > 0.82 && y < H - 44) {
        const out = 10 + noise(i + 41) * 7;
        y += 3 + noise(i + 43) * 3;
        const lipX = Math.max(2, FACE + macro(y) - out);
        pts.push([lipX, y]); shelves.push([lipX, y]);
        y += 4 + noise(i + 44) * 4;
        pts.push([lipX + 3, y]);
        y += 10 + noise(i + 45) * 10;
        pts.push([FACE + macro(y) + 4.5, y]);
      } else if (r < 0.18 && y < H - 30) {
        y += 4 + noise(i + 46) * 5;
        pts.push([FACE + macro(y) + 7 + noise(i + 47) * 4, y]);
        y += 3 + noise(i + 48) * 5;
        pts.push([FACE + macro(y) - 2, y]);
      } else {
        y += 8 + noise(i) * 12;
        pts.push([FACE + macro(y) + noise(i + 57) * 7 - 3.5, y]);
      }
    }
    pts[pts.length - 1][1] = H;
  }
  const facePath = pts.map((p, j) => (j ? 'L' : 'M') + f1(p[0]) + ' ' + f1(p[1])).join('');
  function surf(yy) {
    yy = Math.max(0, Math.min(H, yy));
    if (yy <= pts[0][1]) return pts[0][0];
    for (let j = 1; j < pts.length; j++) {
      if (yy <= pts[j][1]) {
        const [x0, y0] = pts[j - 1], [x1, y1] = pts[j];
        return x0 + (x1 - x0) * ((yy - y0) / (y1 - y0 || 1));
      }
    }
    return pts[pts.length - 1][0];
  }
  const slope = yy => (surf(yy + 4) - surf(yy - 4)) / 8;

  /* ---- Band geometry ----
     Width range widened a touch (2.8..9) and smoothed harder, so the
     thick/thin story is clearer but transitions are calm. */
  function targetWidth(y) {
    let s = 0, n = 0;
    for (let d = -16; d <= 16; d += 4) { s += slope(y + d); n++; }
    s /= n;
    return 2.8 + Math.max(0, Math.min(9, 3.2 + s * 5.5));
  }
  const innerRaw = [];
  for (let y = 0; y <= H; y += 2) {
    let x = 0;
    for (let d = -5; d <= 5; d += 2.5) x = Math.max(x, surf(y + d) + 2.4);
    innerRaw.push(Math.max(x, surf(y) + targetWidth(y)));
  }
  for (let pass = 0; pass < 3; pass++) {
    const src = innerRaw.slice();
    for (let i = 1; i < src.length - 1; i++)
      innerRaw[i] = (src[i - 1] + src[i] * 2 + src[i + 1]) / 4;
  }
  function innerX(y) {
    const i = Math.max(0, Math.min(innerRaw.length - 1, y / 2));
    const i0 = Math.floor(i), t = i - i0;
    const a = innerRaw[i0], b = innerRaw[Math.min(innerRaw.length - 1, i0 + 1)];
    return a + (b - a) * t;
  }

  function path(svg, d, w, opacity) {
    const p = document.createElementNS(NS, 'path');
    p.setAttribute('d', d);
    p.setAttribute('fill', 'none');
    p.setAttribute('stroke', '#000');
    p.setAttribute('stroke-width', w);
    if (opacity) p.setAttribute('stroke-opacity', opacity);
    p.setAttribute('stroke-linecap', 'round');
    p.setAttribute('stroke-linejoin', 'round');
    svg.appendChild(p);
    return p;
  }

  /* ONE geometry for everything. The inner edge is a single polyline
     (already triple-smoothed above); that exact polyline is BOTH the
     drawn inner line and the inner boundary of the clip region, and the
     outer boundary of the clip is the exact facePath point list. So the
     clipped hatch ends precisely under the drawn lines — it cannot fall
     short of them or cross them, because they are the same path. */
  let innerPathStr = '';
  for (let y = 0; y <= H; y += 2) innerPathStr += (y ? L : M)(innerX(y), y);
  function bandRegion() {
    let d = facePath;                       // down the outer edge (exact)
    for (let y = H; y >= 0; y -= 2) d += L(innerX(y), y);  // up the inner
    return d + 'Z';
  }

  let clipN = 0;
  function render(svg) {
    /* Long parallel 58° rules drawn across the whole strip, clipped by
       the band region. The clip cuts every stroke exactly on both
       edges — nothing can fall short, overflow, or cross. */
    const clip = document.createElementNS(NS, 'clipPath');
    const cid = 'bandclip' + (++clipN);
    clip.setAttribute('id', cid);
    const cp = document.createElementNS(NS, 'path');
    cp.setAttribute('d', bandRegion());
    clip.appendChild(cp);
    svg.appendChild(clip);

    const g = document.createElementNS(NS, 'g');
    g.setAttribute('clip-path', 'url(#' + cid + ')');
    svg.appendChild(g);
    /* One family of long parallel rules covering the strip, but the
       spacing between consecutive rules breathes with what the band is
       doing where this rule will actually cross it: wide (shadowed)
       stretches and under-lip pockets pack tighter, thin lit runs open
       up. Rules stay perfectly parallel — only the gaps change — so
       density reads as shading with zero risk of crossing. */
    const DYDX = 0.29 / 0.45;             // 58° slope
    const underLip = yy => {
      let u = 0;
      for (const [, sy] of shelves) {
        const d = yy - sy;
        if (d > 0 && d < 20) u = Math.max(u, 1 - d / 20);
      }
      return u;
    };
    let t = '';
    let y = -W;
    while (y < H + W) {
      t += M(0, y) + L(W, y + W * DYDX);
      // sample the band roughly where this rule passes through it
      const yMid = Math.max(0, Math.min(H, y + 14 * DYDX + 8));
      const wHere = innerX(yMid) - surf(yMid);
      let sp = 2.7 + Math.max(0, 9.5 - wHere) * 0.6;       // wide→2.7, thin→~6.5
      sp = Math.max(2.1, sp - underLip(yMid) * 1.3);       // pockets tighten, floored
      y += sp;
    }
    const rules = document.createElementNS(NS, 'path');
    rules.setAttribute('d', t);
    rules.setAttribute('fill', 'none');
    rules.setAttribute('stroke', '#000');
    rules.setAttribute('stroke-width', 0.6);
    g.appendChild(rules);

    renderEdges(svg);
  }

  function renderEdges(svg) {
    // The drawn inner line IS the clip boundary polyline — one geometry
    path(svg, innerPathStr, 0.9);
    path(svg, facePath, 2);
  }

  const row = document.getElementById('row');
  for (const zoom of [1, 2, 4]) {
    const fig = document.createElement('figure');
    const svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('width', W * zoom); svg.setAttribute('height', H * zoom);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    render(svg);
    const cap = document.createElement('figcaption');
    cap.textContent = zoom + '×';
    fig.append(svg, cap);
    row.appendChild(fig);
  }
})();
</script>
</body>
</html>
