# Cloudflare Pages config for the zsaeed.com project.
#
# This file exists for one reason: the D1 binding below. Pages Functions can
# only reach a database that's bound by name, and the binding has to be
# declared somewhere — either here or by hand in the dashboard. Here means it
# is in git with everything else.
#
# Because this file declares pages_build_output_dir, the deploy command no
# longer takes arguments — `npx wrangler pages deploy` reads both the output
# directory and the project name from here.
#
# Secrets are NOT declared here. ROBOFLOW_API_KEY and PULSE_SALT live in the
# Pages dashboard (Settings > Environment variables) and in .dev.vars locally.
# Adding a [vars] block would shadow the dashboard values, so there isn't one.

name = "zainsaeed"
pages_build_output_dir = "public"
compatibility_date = "2025-08-11"

# The visit/presence counters behind the stats strip on the home page.
# Created 2026-08-11. If it ever has to be rebuilt:
#   npx wrangler d1 create zainsaeed-pulse
#   npx wrangler d1 execute zainsaeed-pulse --remote --file=schema.sql
# and paste the new id below — the id is what the binding resolves on, not
# the name, so a rebuilt database with the same name still needs it changed.
[[d1_databases]]
binding = "PULSE_DB"
database_name = "zainsaeed-pulse"
database_id = "8b1cda6d-0645-44f3-8970-efb63d246681"
