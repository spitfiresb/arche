<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unpak system map</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    background: #1a1a1a; display: flex;
    align-items: center; justify-content: center;
  }
  main { width: 100%; height: 100%; padding: 0.25rem; box-sizing: border-box; }
  svg { display: block; width: 100%; height: 100%; }

    .apath { stroke-dasharray: 4 5; animation: dashmove 1.6s linear infinite; }
    @keyframes dashmove { to { stroke-dashoffset: -9; } }
    .svg-mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace; }
    svg text { font-family: "Sohne", "Helvetica Neue", "Inter", -apple-system,
      BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
</style>
</head>
<body>
<main>
<svg viewBox="0 0 920 884" preserveAspectRatio="xMidYMid meet" width="100%" role="img" aria-label="Unpak detailed architecture map">
      <defs>
        <marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto">
          <path d="M0 0 L8 4 L0 8 z" fill="rgba(242,242,242,0.35)"/>
        </marker>
      </defs>

      <!-- top row: capture to modal, tight -->
      <rect x="20" y="20" width="250" height="200" rx="8" fill="none" stroke="rgba(242,242,242,0.1)"/>
      <text x="38" y="48" fill="#7e7e7e" font-size="11.5" letter-spacing="1.5">EMPLOYEE MACHINE</text>
      <rect x="38" y="60" width="214" height="76" rx="5" fill="rgba(242,242,242,0.02)" stroke="rgba(242,242,242,0.22)"/>
      <text x="52" y="84" fill="#f2f2f2" font-size="14">pak, capture</text>
      <text x="52" y="102" fill="#a0a0a0" font-size="11.5">capture agent, grabs ocr + ax tree</text>
      <text x="52" y="116" fill="#a0a0a0" font-size="11.5">and writes to a local SQL lite DB</text>
      <text class="svg-mono" x="52" y="131" fill="#7e7e7e" font-size="10.5">rust · 8 MB binary</text>
      <rect x="38" y="146" width="214" height="60" rx="5" fill="rgba(242,242,242,0.02)" stroke="rgba(242,242,242,0.22)"/>
      <text x="52" y="169" fill="#f2f2f2" font-size="14">anonymize &amp; compress</text>
      <text x="52" y="186" fill="#a0a0a0" font-size="11.5">strips PII's before sending</text>
      <text x="52" y="199" fill="#a0a0a0" font-size="11.5">data to the blob storage</text>
      <line x1="145" y1="136" x2="145" y2="144" stroke="rgba(242,242,242,0.35)" marker-end="url(#arr)"/>

      <rect x="330" y="84" width="220" height="76" rx="5" fill="rgba(242,242,242,0.02)" stroke="rgba(242,242,242,0.22)"/>
      <text x="346" y="110" fill="#f2f2f2" font-size="14">Cloudflare R2</text>
      <text x="346" y="128" fill="#a0a0a0" font-size="11.5">stores raw session blobs,</text>
      <text x="346" y="142" fill="#a0a0a0" font-size="11.5">siloed per enterprise</text>

      <rect x="610" y="48" width="290" height="146" rx="8" fill="none" stroke="rgba(242,242,242,0.1)"/>
      <text x="630" y="76" fill="#7e7e7e" font-size="11.5" letter-spacing="1.5">MODAL</text>
      <rect x="630" y="88" width="250" height="44" rx="5" fill="rgba(242,242,242,0.02)" stroke="rgba(242,242,242,0.22)"/>
      <text x="646" y="107" fill="#f2f2f2" font-size="13">ingress endpoints</text>
      <text x="646" y="122" fill="#a0a0a0" font-size="11">mint pre-signed upload URLs</text>
      <rect x="630" y="140" width="250" height="44" rx="5" fill="rgba(242,242,242,0.02)" stroke="rgba(242,242,242,0.22)"/>
      <text x="646" y="159" fill="#f2f2f2" font-size="13">process_day worker</text>
      <text x="646" y="174" fill="#a0a0a0" font-size="11">runs the pipelines nightly</text>

      <path class="apath" d="M272 176 C 306 176 306 122 328 122" fill="none" stroke="rgba(242,242,242,0.35)" marker-end="url(#arr)"/>
      <text x="280" y="148" fill="#7e7e7e" font-size="10.5">every 15 min</text>
      <line class="apath" x1="552" y1="122" x2="608" y2="122" stroke="rgba(242,242,242,0.35)" marker-end="url(#arr)"/>
      <text x="548" y="108" fill="#7e7e7e" font-size="10.5">nightly pull</text>

      <line class="apath" x1="755" y1="196" x2="755" y2="248" stroke="rgba(242,242,242,0.35)" marker-end="url(#arr)"/>
      <text x="765" y="228" fill="#7e7e7e" font-size="10.5">calls the pipeline</text>

      <!-- processing pipeline: snake -->
      <rect x="20" y="252" width="880" height="296" rx="8" fill="none" stroke="rgba(242,242,242,0.1)"/>
      <text x="38" y="284" fill="#7e7e7e" font-size="11.5" letter-spacing="1.5">PROCESSING PIPELINE, PER SESSION</text>

      <g>
        <rect x="40" y="300" width="240" height="96" rx="5" fill="rgba(242,242,242,0.02)" stroke="rgba(242,242,242,0.22)"/>
        <text x="56" y="330" fill="#f2f2f2" font-size="17">slots</text>
        <text x="56" y="352" fill="#a0a0a0" font-size="13.5">focus events coalesced</text>
        <text x="56" y="369" fill="#a0a0a0" font-size="13.5">into app + window spans</text>
        <text class="svg-mono" x="56" y="387" fill="#7e7e7e" font-size="11.5">deterministic code</text>
        <rect x="320" y="300" width="240" height="96" rx="5" fill="rgba(242,242,242,0.02)" stroke="rgba(242,242,242,0.22)"/>
        <text x="336" y="330" fill="#f2f2f2" font-size="17">atomize</text>
        <text x="336" y="352" fill="#a0a0a0" font-size="13.5">act-aligned atoms with</text>
        <text x="336" y="369" fill="#a0a0a0" font-size="13.5">idle-excluded durations</text>
        <text class="svg-mono" x="336" y="387" fill="#7e7e7e" font-size="11.5">deterministic code</text>
        <rect x="600" y="300" width="240" height="96" rx="5" fill="rgba(242,242,242,0.02)" stroke="rgba(242,242,242,0.22)"/>
        <text x="616" y="330" fill="#f2f2f2" font-size="17">describe</text>
        <text x="616" y="352" fill="#a0a0a0" font-size="13.5">one grounded sentence</text>
        <text x="616" y="369" fill="#a0a0a0" font-size="13.5">per atom, plus entities</text>
        <text class="svg-mono" x="616" y="387" fill="#7e7e7e" font-size="11.5">GPT-5 nano</text>
      <line class="apath" x1="282" y1="348" x2="318" y2="348" stroke="rgba(242,242,242,0.35)" marker-end="url(#arr)"/>
      <line class="apath" x1="562" y1="348" x2="598" y2="348" stroke="rgba(242,242,242,0.35)" marker-end="url(#arr)"/>
      <line class="apath" x1="720" y1="398" x2="720" y2="422" stroke="rgba(242,242,242,0.35)" marker-end="url(#arr)"/>
        <rect x="40" y="426" width="240" height="96" rx="5" fill="rgba(242,242,242,0.02)" stroke="rgba(242,242,242,0.22)"/>
        <text x="56" y="456" fill="#f2f2f2" font-size="17">overview</text>
        <text x="56" y="478" fill="#a0a0a0" font-size="13.5">plain-language title and</text>
        <text x="56" y="495" fill="#a0a0a0" font-size="13.5">phases per workflow</text>
        <text class="svg-mono" x="56" y="513" fill="#7e7e7e" font-size="11.5">Sonnet 5</text>
        <rect x="320" y="426" width="240" height="96" rx="5" fill="rgba(242,242,242,0.02)" stroke="rgba(242,242,242,0.22)"/>
        <text x="336" y="456" fill="#f2f2f2" font-size="17">workflows</text>
        <text x="336" y="478" fill="#a0a0a0" font-size="13.5">nodes assembled into</text>
        <text x="336" y="495" fill="#a0a0a0" font-size="13.5">procedures with a slug</text>
        <text class="svg-mono" x="336" y="513" fill="#7e7e7e" font-size="11.5">Sonnet 5</text>
        <rect x="600" y="426" width="240" height="96" rx="5" fill="rgba(242,242,242,0.02)" stroke="rgba(242,242,242,0.22)"/>
        <text x="616" y="456" fill="#f2f2f2" font-size="17">nodes</text>
        <text x="616" y="478" fill="#a0a0a0" font-size="13.5">consecutive atoms</text>
        <text x="616" y="495" fill="#a0a0a0" font-size="13.5">grouped into steps</text>
        <text class="svg-mono" x="616" y="513" fill="#7e7e7e" font-size="11.5">Gemini 3.1 Flash-Lite</text>
      <line class="apath" x1="598" y1="474" x2="562" y2="474" stroke="rgba(242,242,242,0.35)" marker-end="url(#arr)"/>
      <line class="apath" x1="318" y1="474" x2="282" y2="474" stroke="rgba(242,242,242,0.35)" marker-end="url(#arr)"/>
      </g>
      <text x="40" y="538" fill="#7e7e7e" font-size="10.5">every layer references the one below by stable ordinal, any overview walks down to the raw capture · idempotent per session via input hash</text>

      <!-- analysis pipeline: snake -->
      <rect x="20" y="572" width="880" height="296" rx="8" fill="none" stroke="rgba(242,242,242,0.1)"/>
      <text x="38" y="604" fill="#7e7e7e" font-size="11.5" letter-spacing="1.5">ANALYSIS PIPELINE, CROSS-WORKFORCE, ITS OWN SEPARATE RUN</text>

      <g>
        <rect x="50" y="620" width="360" height="96" rx="5" fill="rgba(242,242,242,0.02)" stroke="rgba(242,242,242,0.22)"/>
        <text x="66" y="650" fill="#f2f2f2" font-size="17">bucket by slug</text>
        <text x="66" y="672" fill="#a0a0a0" font-size="13.5">workflow instances from the whole</text>
        <text x="66" y="689" fill="#a0a0a0" font-size="13.5">corpus, grouped by recurrence slug</text>
        <text class="svg-mono" x="66" y="707" fill="#7e7e7e" font-size="11.5">deterministic code</text>
        <rect x="510" y="620" width="360" height="96" rx="5" fill="rgba(242,242,242,0.02)" stroke="rgba(242,242,242,0.22)"/>
        <text x="526" y="650" fill="#f2f2f2" font-size="17">count populations</text>
        <text x="526" y="672" fill="#a0a0a0" font-size="13.5">how many times, across how many</text>
        <text x="526" y="689" fill="#a0a0a0" font-size="13.5">people, over how many days</text>
        <text class="svg-mono" x="526" y="707" fill="#7e7e7e" font-size="11.5">deterministic code</text>
      <line class="apath" x1="412" y1="668" x2="508" y2="668" stroke="rgba(242,242,242,0.35)" marker-end="url(#arr)"/>
      <line class="apath" x1="690" y1="718" x2="690" y2="742" stroke="rgba(242,242,242,0.35)" marker-end="url(#arr)"/>
        <rect x="50" y="746" width="360" height="96" rx="5" fill="rgba(242,242,242,0.02)" stroke="rgba(242,242,242,0.22)"/>
        <text x="66" y="776" fill="#f2f2f2" font-size="17">AI opportunities</text>
        <text x="66" y="798" fill="#a0a0a0" font-size="13.5">where to add or remove AI, written</text>
        <text x="66" y="815" fill="#a0a0a0" font-size="13.5">as a report back to Neon</text>
        <text class="svg-mono" x="66" y="833" fill="#7e7e7e" font-size="11.5">GPT 5.5</text>
        <rect x="510" y="746" width="360" height="96" rx="5" fill="rgba(242,242,242,0.02)" stroke="rgba(242,242,242,0.22)"/>
        <text x="526" y="776" fill="#f2f2f2" font-size="17">merge &amp; name</text>
        <text x="526" y="798" fill="#a0a0a0" font-size="13.5">look-alike buckets merged into</text>
        <text x="526" y="815" fill="#a0a0a0" font-size="13.5">recurring procedure types</text>
        <text class="svg-mono" x="526" y="833" fill="#7e7e7e" font-size="11.5">GPT 5.4</text>
      <line class="apath" x1="508" y1="794" x2="412" y2="794" stroke="rgba(242,242,242,0.35)" marker-end="url(#arr)"/>
      </g>
      <text x="40" y="858" fill="#7e7e7e" font-size="10.5">recurrence is counted by code, named by a model, the slug, not raw text, makes the same procedure recognizable across people and days</text>
    </svg>
</main>
</body>
</html>
