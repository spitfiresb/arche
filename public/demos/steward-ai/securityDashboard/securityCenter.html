<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Steward AI - Security Overview</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:italic&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script src="../shared/tailwind.cdn.js"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#4d6159",
                        "background-light": "#f9f7f2",
                        "card-light": "#ffffff",
                        "accent-tan": "#c2a894",
                        "accent-brown": "#5e503f",
                        parchment: {
                            50: '#fbfaf8',
                            100: '#f7f5f0',
                            200: '#efece4',
                            300: '#e6e1d6',
                            400: '#dcd6c8',
                        },
                        sage: {
                            100: '#e8ecea',
                            200: '#cedad5',
                            300: '#b0c4bd',
                            500: '#7a998e',
                            600: '#617a71',
                            700: '#4e615a',
                            900: '#2b3632',
                        },
                        ink: {
                            DEFAULT: '#2c2b29',
                            light: '#5e5b56',
                        }
                    },
                    fontFamily: {
                        display: ["Instrument Serif", "serif"],
                        sans: ["Inter", "sans-serif"],
                    },
                    borderRadius: {
                        "clay": "1.5rem",
                        "pill": "9999px"
                    },
                    boxShadow: {
                        "clay": "0 20px 40px -10px rgba(44, 43, 41, 0.08), 0 10px 20px -5px rgba(44, 43, 41, 0.04)",
                        "clay-sm": "0 10px 20px -5px rgba(44, 43, 41, 0.06)",
                    }
                },
            },
        }
    </script>
    <link href="../shared/styles.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.3.3/dist/docx-preview.min.js"></script>
</head>

<body
    class="bg-parchment-100 text-ink font-sans overflow-hidden antialiased selection:bg-sage-200 selection:text-sage-900">
    <div class="flex h-screen w-full relative z-10">
        <main class="flex-1 h-full overflow-y-auto relative flex flex-col bg-background-light" style="opacity: 0">
            <!-- Header -->
            <header class="px-10 pt-12 pb-2">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <button onclick="navigateBack()" id="backButton"
                            class="flex items-center justify-center w-10 h-10 rounded-full bg-white border border-parchment-300 shadow-sm hover:border-sage-300 hover:text-sage-700 transition-all">
                            <span class="material-symbols-outlined">arrow_back</span>
                        </button>
                        <h1 class="font-display italic text-3xl font-medium text-ink">Security Overview</h1>
                    </div>
                </div>
            </header>

            <!-- Main Content -->
            <div class="flex-1 px-10 pt-4 pb-8 overflow-y-auto">
                <!-- Risk events activity chart (full width) -->
                <div class="bg-white rounded-xl shadow-clay-sm border border-slate-100 p-6 mb-8">
                    <div class="flex items-center justify-between mb-4">
                        <div id="filterBar" class="flex items-center gap-2 flex-wrap">
                            <span class="material-symbols-outlined text-slate-400 text-lg">filter_list</span>

                            <!-- Type Dropdown -->
                            <div class="relative">
                                <button id="filterBtn-type" onclick="toggleFilterDropdown('type')"
                                    class="filter-dropdown-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-parchment-50 border border-parchment-200 text-slate-500 hover:border-parchment-300 transition-all">
                                    <span class="label">Type</span>
                                    <span class="material-symbols-outlined text-sm">expand_more</span>
                                </button>
                                <div id="filterDropdown-type"
                                    class="hidden absolute top-full left-0 mt-1 bg-white rounded-lg shadow-clay-sm border border-parchment-200 py-1 z-30 min-w-[180px]">
                                </div>
                            </div>

                            <!-- User Dropdown -->
                            <div class="relative">
                                <button id="filterBtn-user" onclick="toggleFilterDropdown('user')"
                                    class="filter-dropdown-btn flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-medium bg-parchment-50 border border-parchment-200 text-slate-500 hover:border-parchment-300 transition-all">
                                    <span class="label">User</span>
                                    <span class="material-symbols-outlined text-sm">expand_more</span>
                                </button>
                                <div id="filterDropdown-user"
                                    class="hidden absolute top-full left-0 mt-1 bg-white rounded-lg shadow-clay-sm border border-parchment-200 py-1 z-30 min-w-[200px] max-h-[240px] overflow-y-auto">
                                </div>
                            </div>

                            <!-- Clear Filters -->
                            <button id="clearFiltersBtn" onclick="clearAllFilters()"
                                class="hidden items-center gap-1 px-3 py-1.5 rounded-full text-xs font-medium text-primary hover:bg-sage-100 transition-all">
                                <span class="material-symbols-outlined text-sm">close</span>
                                <span>Clear</span>
                                <span id="activeFilterCount"
                                    class="bg-primary text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px]">0</span>
                            </button>
                        </div>
                        <div id="date-filter-mount"></div>
                    </div>
                    <div id="securityActivityChartSection" class="hidden">
                        <div class="flex gap-5 items-start">
                            <!-- Chart (takes remaining space) -->
                            <div class="flex-1 min-w-0">
                                <div class="relative h-64">
                                    <canvas id="securityActivityChart"></canvas>
                                </div>
                                <div id="securityActivityLegend"
                                    class="flex flex-wrap gap-x-3 gap-y-1 mt-2 pt-2 border-t border-parchment-200">
                                </div>
                            </div>
                            <!-- KPI Panel -->
                            <div id="riskKpiPanel" class="w-44 shrink-0 flex flex-col self-start"></div>
                        </div>
                    </div>
                </div>

                <!-- Content Grid -->
                <div class="grid grid-cols-12 gap-8">
                    <!-- Incident Log -->
                    <div class="col-span-12">
                        <div class="bg-white rounded-xl shadow-clay-sm border border-slate-100 p-6">
                            <div class="flex items-center justify-between mb-6">
                                <h2 class="font-display italic text-2xl text-slate-800">Incident Log</h2>
                            </div>

                            <div class="overflow-visible w-full">
                                <table class="w-full text-left table-fixed">
                                    <thead>
                                        <tr
                                            class="text-[10px] uppercase tracking-widest text-ink-light font-bold border-b border-parchment-200">
                                            <th class="pb-4 font-medium" style="width:15%">User</th>
                                            <th class="pb-4 font-medium" style="width:16%">Context</th>
                                            <th class="pb-4 font-medium" style="width:13%">Model</th>
                                            <th class="pb-4 font-medium" style="width:14%">Type</th>
                                            <th class="pb-4 font-medium" style="width:26%">File Name</th>
                                            <th class="pb-4 font-medium" style="width:16%">Date</th>
                                        </tr>
                                    </thead>
                                    <tbody id="incidentsTableBody" class="text-sm">
                                        <tr>
                                            <td colspan="6" class="py-8 text-center text-slate-400">Loading incidents...
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>

                                <div id="incidentsEmptyState" class="hidden py-20 text-center text-gray-400">
                                    <span class="material-symbols-outlined text-4xl mb-2">security</span>
                                    <p>No incidents found.</p>
                                </div>

                                <!-- Pagination -->
                                <div id="incidentsPagination"
                                    class="hidden items-center justify-between pt-4 mt-2 border-t border-parchment-200">
                                    <!-- Populated dynamically by renderIncidents() -->
                                </div>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="../shared/mockBackend.js"></script><script src="../shared/utils/common.js"></script>
    <script src="../shared/components/dateFilter.js"></script>
    <script src="securityCenter.js"></script>
</body>

</html>
