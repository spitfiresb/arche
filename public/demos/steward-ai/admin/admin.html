<!DOCTYPE html>
<html class="light" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Steward AI Admin Dashboard</title>
    <script src="../shared/tailwind.cdn.js"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
        href="https://fonts.googleapis.com/css2?family=Instrument+Serif:italic&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        primary: "#2C2C2C",
                        "sage-light": "#E8ECE6",
                        "sage-medium": "#C4CFC6",
                        "clay-warm": "#D6C0B3",
                        "clay-dark": "#8C6A5D",
                        "background-light": "#F2F0EB",
                        "card-light": "#FAFAF8",
                        parchment: {
                            50: "#faf9f7",
                            100: "#f5f3ef",
                            200: "#ebe7df",
                            300: "#ddd8cd",
                            400: "#c9c2b5",
                        },
                        sage: {
                            100: "#e8ece6",
                            200: "#d1dace",
                            300: "#b4c2b0",
                            500: "#6b8c64",
                            600: "#557a4e",
                            700: "#436040",
                            900: "#243423",
                        },
                        ink: {
                            DEFAULT: "#2c2b29",
                            light: "#5e5b56",
                        },
                        "accent-tan": "#c2a894",
                        "accent-green-light": "#a8c5a0",
                        "accent-brown": "#8c6a5d",
                        "accent-sand": "#d6c0b3",
                    },
                    fontFamily: {
                        serif: ["'Instrument Serif'", "serif"],
                        display: ["'Instrument Serif'", "serif"],
                        sans: ["'Inter'", "sans-serif"],
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        "xl": "0.5rem",
                        "2xl": "1rem",
                        clay: "1.5rem",
                        pill: "9999px",
                    },
                    boxShadow: {
                        clay: "0 20px 40px -10px rgba(44,43,41,0.08), 0 10px 20px -5px rgba(44,43,41,0.04)",
                        "clay-sm": "0 10px 20px -5px rgba(44,43,41,0.06)",
                    },
                },
            },
        };
    </script>
    <link href="../shared/styles.css" rel="stylesheet" />
    <style>
        .material-symbols-outlined {
            font-variation-settings:
                'FILL' 0,
                'wght' 400,
                'GRAD' 0,
                'opsz' 24
        }

        @keyframes modal-in {
            from {
                opacity: 0;
                transform: scale(0.95) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .animate-modal-in {
            animation: modal-in 0.25s ease-out forwards;
        }

        .quick-action-content {
            position: relative;
            display: inline-flex;
            align-items: center;
        }

        .quick-action-content::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 0;
            height: 1.5px;
            background: #2C2C2C;
            transition: width 0.25s ease-out;
        }

        .quick-action-btn:hover .quick-action-content::after {
            width: 100%;
        }
    </style>
</head>

<body class="bg-background-light text-primary font-sans overflow-hidden antialiased">
    <div class="flex h-screen w-full relative z-10">

        <main class="flex-1 h-full overflow-hidden flex flex-col bg-background-light" style="opacity: 0">

            <header
                class="sticky top-0 z-20 bg-background-light px-8 py-2 border-b border-parchment-300/50 flex flex-col md:flex-row gap-6 justify-between md:items-center">

                <div class="flex items-center gap-12">
                    <div id="appLogo" class="flex flex-col">
                        <h1 class="text-2xl font-serif text-ink tracking-tight">Steward AI</h1>
                    </div>
                </div>

                <div class="flex items-center">
                    <!-- User Profile Badge -->
                    <div class="relative border-parchment-200">
                        <div id="userProfileBadge" class="flex items-center">
                            <div class="text-right">
                                <p class="text-sm font-semibold text-slate-900" id="userName">User</p>
                                <p class="text-[10px] uppercase tracking-widest text-slate-400" id="userRole">Admin</p>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Scrollable Content Area -->
            <div class="flex-1 overflow-y-auto">
                <div class="px-6 py-10 md:py-14">
                    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

                        <!-- Company Name + KPI Stats (full-width row) -->
                        <section class="lg:col-span-12 mb-8 flex items-end justify-between gap-20 pb-12">
                            <div class="min-w-0">
                                <h1
                                    class="text-7xl md:text-9xl font-display font-bold text-primary tracking-tighter leading-none translate-y-4 min-h-[1em]">
                                    <span id="contentTeamName"></span>
                                </h1>
                            </div>
                            <div id="kpiContainer" class="flex gap-8 lg:gap-16 xl:gap-24 flex-shrink-0">
                                <div class="flex flex-col">
                                    <span
                                        class="text-xs font-semibold uppercase tracking-widest text-gray-500 mb-2">Members</span>
                                    <span id="statTotalMembers"
                                        class="text-5xl font-display text-primary leading-none">0</span>
                                </div>
                                <div class="flex flex-col">
                                    <span
                                        class="text-xs font-semibold uppercase tracking-widest text-gray-500 mb-2">Managers</span>
                                    <span id="statTotalManagers"
                                        class="text-5xl font-display text-primary leading-none">0</span>
                                </div>
                                <div class="flex flex-col">
                                    <span
                                        class="text-xs font-semibold uppercase tracking-widest text-gray-500 mb-2">Prompts</span>
                                    <span id="statTotalPrompts"
                                        class="text-5xl font-display text-primary leading-none">0</span>
                                </div>
                                <div class="flex flex-col">
                                    <span
                                        class="text-xs font-semibold uppercase tracking-widest text-gray-500 mb-2">Risk
                                        Events</span>
                                    <div class="flex items-start gap-2">
                                        <span id="statRiskEvents"
                                            class="text-5xl font-display text-primary leading-none">0</span>
                                        <span id="statRiskBadge"
                                            class="text-[10px] font-bold uppercase tracking-widest text-emerald-500 flex items-center gap-1 mt-2">
                                            <span
                                                class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>Safe
                                        </span>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <!-- Departments (8 cols) -->
                        <section class="lg:col-span-8">
                            <div class="flex items-center justify-between mb-5 px-1">
                                <h2 class="text-xl font-display font-semibold text-primary">Departments</h2>
                                <div id="deptPagination" class="hidden items-center gap-2">
                                    <button id="deptPrevBtn" onclick="changeDeptPage(-1)"
                                        class="w-7 h-7 flex items-center justify-center rounded-full hover:bg-white/80 transition-colors text-slate-400 hover:text-primary disabled:opacity-30 disabled:cursor-default">
                                        <span class="material-symbols-outlined text-lg">chevron_left</span>
                                    </button>
                                    <div id="deptPageDots" class="flex items-center gap-1.5"></div>
                                    <button id="deptNextBtn" onclick="changeDeptPage(1)"
                                        class="w-7 h-7 flex items-center justify-center rounded-full hover:bg-white/80 transition-colors text-slate-400 hover:text-primary disabled:opacity-30 disabled:cursor-default">
                                        <span class="material-symbols-outlined text-lg">chevron_right</span>
                                    </button>
                                </div>
                            </div>
                            <div id="managerCardsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
                            <div id="noManagersMessage" class="hidden text-center py-12 text-gray-400">
                                <span class="material-symbols-outlined text-4xl mb-2">group_off</span>
                                <p class="text-sm">No managers found in your team.</p>
                            </div>
                        </section>

                        <!-- Quick Actions (far right) -->
                        <section class="lg:col-span-3 lg:col-start-10 mt-8 lg:mt-0">
                            <div
                                class="bg-transparent h-full border-t border-sage-medium/30 pt-8 lg:border-t-0 lg:pt-0">
                                <h3 id="quickActionsHeading"
                                    class="text-xl font-display font-semibold text-primary mb-5 px-2">Quick
                                    Actions</h3>
                                <div class="border-l border-parchment-300 pl-2">
                                    <ul class="space-y-2">
                                        <li>
                                            <button onclick="navigateToTeamOverview()"
                                                class="w-full text-left flex items-center p-3 rounded quick-action-btn">
                                                <span class="quick-action-content gap-3">
                                                    <span
                                                        class="material-symbols-outlined text-gray-500 text-xl">group</span>
                                                    <span class="text-sm font-medium text-gray-700">Team Overview</span>
                                                </span>
                                            </button>
                                        </li>
                                        <li>
                                            <button onclick="navigateToSecurityCenter()"
                                                class="w-full text-left flex items-center p-3 rounded quick-action-btn">
                                                <span class="quick-action-content gap-3">
                                                    <span
                                                        class="material-symbols-outlined text-gray-500 text-xl">shield</span>
                                                    <span class="text-sm font-medium text-gray-700">Security
                                                        Center</span>
                                                </span>
                                            </button>
                                        </li>
                                        <li>
                                            <button onclick="navigateToMyUsage()"
                                                class="w-full text-left flex items-center p-3 rounded quick-action-btn">
                                                <span class="quick-action-content gap-3">
                                                    <span
                                                        class="material-symbols-outlined text-gray-500 text-xl">analytics</span>
                                                    <span class="text-sm font-medium text-gray-700">My Usage</span>
                                                </span>
                                            </button>
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </section>

                    </div>
                </div>
            </div>

            <!-- Background Decorative Element -->
            <div class="fixed top-0 right-0 -z-10 opacity-40 pointer-events-none">
                <svg fill="none" height="800" viewBox="0 0 400 400" width="800">
                    <circle cx="350" cy="50" fill="url(#paint0_radial)" r="330"></circle>
                    <defs>
                        <radialGradient cx="0" cy="0" gradientTransform="translate(350 50) rotate(90) scale(330)"
                            gradientUnits="userSpaceOnUse" id="paint0_radial" r="1">
                            <stop stop-color="#2C2C2C" stop-opacity="0.06"></stop>
                            <stop offset="1" stop-color="#2C2C2C" stop-opacity="0"></stop>
                        </radialGradient>
                    </defs>
                </svg>
            </div>

        </main>
    </div>

    <script src="../shared/mockBackend.js"></script><script src="../shared/utils/common.js"></script>
    <script>
        // On Windows there are no traffic-light buttons, so move the logo to the left
        if (window.electronAPI && electronAPI.platform !== 'darwin') {
            const logo = document.getElementById('appLogo');
            if (logo) logo.style.marginLeft = '-.4rem';
        }
    </script>
    <script src="app.js"></script>
</body>

</html>
