<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Liquid glass</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    --ink: #10131a;
    --slate: #5b6472;
    --ink-strong: #05070c;
    --line: rgba(23, 56, 105, 0.16);
    font-family: "Sohne", "Helvetica Neue", "Inter", -apple-system,
      BlinkMacSystemFont, Helvetica, Arial, sans-serif;
    background: #FCFCFB;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .stage {
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* speed toggle, centered at the top: a segmented control with a grey pill
     that slides between the two options. */
  .speed {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    display: inline-flex;
    z-index: 20;
    padding: 3px;
    background: linear-gradient(#fff, #f6f7f6);
    border: 1px solid var(--line);
    border-radius: 999px;
  }
  /* the grey pill, sitting behind the labels; JS parks it over the active
     option and CSS animates the move and the width change */
  .speed-thumb {
    position: absolute;
    top: 3px;
    left: 3px;
    height: calc(100% - 6px);
    width: 0;
    border-radius: 999px;
    background: rgba(23, 56, 105, 0.09);
    box-shadow: inset 0 0 0 1px rgba(23, 56, 105, 0.06);
    transition: transform .34s cubic-bezier(.34, 1.2, .38, 1),
                width .34s cubic-bezier(.34, 1.2, .38, 1);
    pointer-events: none;
  }
  .speed-opt {
    position: relative;
    z-index: 1;
    font: inherit;
    font-size: 12.5px;
    color: var(--slate);
    background: transparent;
    border: 0;
    border-radius: 999px;
    padding: 6px 14px;
    white-space: nowrap;
    cursor: pointer;
    transition: color .2s;
  }
  .speed-opt[aria-pressed="true"] { color: var(--ink-strong); }

  /* the nav the lens lives in — blown up ~2.5x from the original,
     data-glass-scale keeps the lens geometry in step with the type */
  nav {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 160px;
    padding: 0 40px;
    width: 100%;
  }
  .tabs {
    display: flex;
    align-items: center;
    gap: clamp(40px, 6vw, 96px);
    position: relative;
  }
  .tabs a {
    z-index: 1;
    color: var(--slate);
    padding: 16px 24px;
    font-size: 34px;
    font-weight: 400;
    letter-spacing: -0.01em;
    text-decoration: none;
    transition: color .2s;
    position: relative;
    cursor: pointer;
  }
  .tabs a:hover, .tabs a.tab-active { color: var(--ink); }
  .tab-lens { z-index: 2; pointer-events: none; position: absolute; }
  .tab-bubble {
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    background: linear-gradient(#fff, #f6f7f6);
    border: 1px solid rgba(23, 56, 105, 0.16);
    border-radius: 999px;
    width: 0; height: 0;
    position: absolute;
    top: 0; left: 0;
    box-shadow: 0 0 18px rgba(15, 42, 74, 0.16), 0 0 2px rgba(15, 42, 74, 0.10);
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="speed" role="group" aria-label="Animation speed">
      <span class="speed-thumb" aria-hidden="true"></span>
      <button type="button" class="speed-opt" data-speed="normal" aria-pressed="true">Normal</button>
      <button type="button" class="speed-opt" data-speed="slow" aria-pressed="false">Slow motion</button>
    </div>

    <nav aria-label="Liquid glass demo" data-glass-scale="2.5">
      <div class="tabs">
        <span class="tab-bubble" aria-hidden="true"></span>
        <a href="#" class="tab-active" aria-current="page">Overview</a>
        <a href="#">Pricing</a>
        <a href="#">Company</a>
      </div>
    </nav>
  </div>

  <script src="glass.js"></script>
  <script>
  // Slide the grey pill over the chosen option and set the shared slow-motion
  // time scale that glass.js reads.
  (function () {
    var speed = document.querySelector('.speed');
    if (!speed) return;
    var thumb = speed.querySelector('.speed-thumb');
    var opts = Array.prototype.slice.call(speed.querySelectorAll('.speed-opt'));

    function placeThumb(btn, animate) {
      if (!animate) {
        var prev = thumb.style.transition;
        thumb.style.transition = 'none';
        thumb.style.width = btn.offsetWidth + 'px';
        thumb.style.transform = 'translateX(' + (btn.offsetLeft - 3) + 'px)';
        void thumb.offsetWidth;          // flush, so the next change animates
        thumb.style.transition = prev;
        return;
      }
      thumb.style.width = btn.offsetWidth + 'px';
      thumb.style.transform = 'translateX(' + (btn.offsetLeft - 3) + 'px)';
    }

    function activeBtn() {
      return speed.querySelector('.speed-opt[aria-pressed="true"]') || opts[0];
    }

    opts.forEach(function (btn) {
      btn.addEventListener('click', function () {
        opts.forEach(function (b) {
          b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
        });
        placeThumb(btn, true);
        window.glassTimeScale = btn.dataset.speed === 'slow' ? 0.12 : 1;
      });
    });

    placeThumb(activeBtn(), false);
    window.addEventListener('resize', function () { placeThumb(activeBtn(), false); });
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { placeThumb(activeBtn(), false); });
    }
  })();
  </script>
</body>
</html>
