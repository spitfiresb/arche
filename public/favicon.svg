<!-- A white sphere lit from the upper left. The gradient stops trace a measured
     falloff rather than an even ramp: flat through the lit half, then dropping
     away over the last third, which is what reads as a lit ball instead of a
     disc with a vignette. It bottoms out at #a2a2a2 — deeper than a real white
     sphere would go, because at 16px on a light tab bar that lower-right gray
     is the only thing giving the silhouette an edge. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="sphere" cx="34%" cy="27%" r="92%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="34%" stop-color="#fbfbfb"/>
      <stop offset="54%" stop-color="#f1f1f1"/>
      <stop offset="70%" stop-color="#e3e3e3"/>
      <stop offset="82%" stop-color="#d0d0d0"/>
      <stop offset="92%" stop-color="#bababa"/>
      <stop offset="100%" stop-color="#a2a2a2"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="15.4" fill="url(#sphere)"/>
</svg>
