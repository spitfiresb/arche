<!-- A diagonal two-stop linear gradient, forest green at the top-left to white
     at the bottom-right. Pure white lands at the corner of the bounding box,
     past the circle's rim, so the ball itself only reaches a pale mint at its
     lower-right edge — the green stays dominant. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c4d26"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <circle cx="16" cy="16" r="15.4" fill="url(#grad)"/>
</svg>
