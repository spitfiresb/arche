<!-- A sphere lit from the lower-right corner: white at the 4:30 rim easing
     through mint and sage into forest green, darkest at the upper-left. The
     gradient center sits on the rim itself (78%/78%) so the ramp is monotonic —
     centering it inside the ball would put green on both sides of the white
     and read as a spotlight instead of a lit sphere. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="sphere" cx="78%" cy="78%" r="115%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="14%" stop-color="#eef6ea"/>
      <stop offset="30%" stop-color="#c8e0bd"/>
      <stop offset="47%" stop-color="#8db884"/>
      <stop offset="63%" stop-color="#548e51"/>
      <stop offset="81%" stop-color="#2f6f38"/>
      <stop offset="100%" stop-color="#1c4d26"/>
    </radialGradient>
  </defs>
  <circle cx="16" cy="16" r="15.4" fill="url(#sphere)"/>
</svg>
